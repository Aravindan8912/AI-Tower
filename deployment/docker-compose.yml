services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - aat_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: deployment/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__AatDatabase: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Auth__JwtSigningKey: ${AAT_JWT_SIGNING_KEY}
      Database__AutoMigrate: "true"
      Cors__Origins__0: http://localhost:8088
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5080:8080"

  dashboard:
    build:
      context: ..
      dockerfile: deployment/dashboard.Dockerfile
    depends_on:
      - api
    ports:
      - "8088:80"

volumes:
  aat_pg:
